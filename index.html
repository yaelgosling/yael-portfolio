<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon</title>

  <!-- The Instrument Serif font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- The "Coming soon" screen: a stage with the same proportions as the Figma frame -->
  <main class="coming-soon">

    <!-- The main title (bottom layer, the illustrations sit on top of it) -->
    <h1 class="coming-soon__title">COMING SOON</h1>

    <!-- Small figure standing on top of the letter G -->
    <img class="coming-soon__figure" src="images/figure-large.png" alt="">

    <!-- My name, top left -->
    <p class="coming-soon__name">Yael Gosling</p>

  </main>

</body>
</html>
