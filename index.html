<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon</title>

  <!-- The Instrument Serif font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- The "Coming soon" screen: fills the window, and the wall inside it can be pulled around -->
  <main class="coming-soon">
    <div class="coming-soon__wall">

      <!-- The hand-drawn frames artwork (bottom layer) -->
      <div class="coming-soon__background">
        <img class="coming-soon__background-image" src="images/home-frames-background.png" alt="">
      </div>

      <!-- The title, inside the big blue frame -->
      <h1 class="coming-soon__title">COMING<br>SOON</h1>

      <!-- My name. It starts outside the first view: pull the wall to see all of it -->
      <p class="coming-soon__name">Yael Gosling</p>

      <!-- Link to the process page: covers the whole orange frame and the word in it -->
      <a class="coming-soon__process-link" href="process.html">
        <span class="coming-soon__process-word">Process</span>
      </a>

    </div>
  </main>

  <script src="script.js"></script>

</body>
</html>
